name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clauseiq
          POSTGRES_PASSWORD: clauseiq
          POSTGRES_DB: clauseiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clauseiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://clauseiq:clauseiq@localhost:5432/clauseiq_test
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (tesseract + poppler, needed by the extraction module at import time)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python deps
        working-directory: backend
        run: pip install -r requirements-dev.txt --break-system-packages

      - name: Run alembic migrations against the test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://clauseiq:clauseiq@localhost:5432/clauseiq_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
